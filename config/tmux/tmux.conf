# Alacritty-matched tmux setup.

set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB,xterm-256color:RGB"
set -g focus-events on
set -g set-clipboard external
set -g escape-time 10
set -g history-limit 12000
set -g mouse on
set -g allow-passthrough off
set -g display-time 2000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g automatic-rename off

setw -g mode-keys vi
set -g status-keys vi

# Prefix: C-Space (en vez del default C-b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy.sh"
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy.sh"

# Popups (tmux 3.2+)
# g: terminal flotante efímero en el dir actual
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
# f: cambiar entre sesiones tmux existentes (fzf)
bind f display-popup -E 'session=$(tmux list-sessions -F "#{session_name}" | fzf --reverse) && [ -n "$session" ] && tmux switch-client -t "$session"'
# s: sessionizer (sesh + fzf) — saltar a cualquier proyecto/dir como sesion
bind s display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list | fzf --reverse)"'

# Escribir en todos los panes a la vez (multi-SSH)
bind S setw synchronize-panes

# tmux anidado (SSH a otra caja con tmux): F12 apaga el prefix local
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "bg=#34302b,fg=#a9a196" \;\
  display "tmux anidado: OFF"
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  display "tmux local: ON"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 100
set -g status-style "bg=#0d0d0c,fg=#a9a196"

set -g status-left "#[fg=#d84a3a,bold] #S #[fg=#514c44]| #{?@git_branch,#[fg=#caa96a]#{@git_branch} #[fg=#514c44]| ,}"
set -g status-right "#[fg=#caa96a]#(sh ~/.config/tmux/plugins/tmux-battery/scripts/battery_percentage.sh) #[fg=#514c44]| #[fg=#caa96a]%H:%M #[fg=#514c44]| #(sh ~/.config/tmux/scripts/wg_status.sh) #[default]"

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#514c44] #[fg=#a9a196]#I:#W#F "
setw -g window-status-current-format "#[fg=#0d0d0c,bg=#d84a3a,bold] #I:#W#F #[default]"
setw -g window-status-activity-style "fg=#caa96a,bg=#0d0d0c"

set -g pane-border-style "fg=#34302b"
set -g pane-active-border-style "fg=#d84a3a"
set -g display-panes-colour "#caa96a"
set -g display-panes-active-colour "#d84a3a"

set -g message-style "bg=#1a1916,fg=#ece5d8"
set -g message-command-style "bg=#1a1916,fg=#caa96a"
setw -g mode-style "bg=#caa96a,fg=#0d0d0c"

set -g clock-mode-colour "#d84a3a"
setw -g monitor-activity on
set -g visual-activity off

# Plugins fijados por revisión en config/tmux/plugins.lock.
# install.sh verifica el origen y hace checkout separado de cada revisión.
set -g @continuum-restore 'on'

if-shell '[ -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux ]' \
  'run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell '[ -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux ]' \
  'run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
if-shell '[ -f ~/.config/tmux/plugins/tmux-battery/battery.tmux ]' \
  'run-shell ~/.config/tmux/plugins/tmux-battery/battery.tmux'
